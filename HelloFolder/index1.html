<!DOCTYPE html>
<html>
<head>
<title>Login Form</title>
<style>
body{background:#eef3fb;font-family:Arial;}
.box{width:400px;margin:100px auto;padding:30px;background:white;
box-shadow:0 0 10px #ccc;}
h1{text-align:center;color:#17345c;}
input,button{width:100%;padding:12px;margin:10px 0;
box-sizing:border-box;}
button{background:#2878f0;color:white;border:0;}
</style>
</head>

<body>
<div class="box">
<h1>User Login</h1>

<label>User Name</label>
<input type="text" placeholder="Enter your name">

<label>Password</label>
<input type="password" placeholder="Enter your password">

<button>Submit</button>
<button type="reset">Reset</button>
</div>
</body>
</html>
